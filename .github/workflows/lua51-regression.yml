name: NLL Lua 5.1 regression tests

on:
  push:
    branches:
      - main
      - 'dev/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lua51:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
      - name: Syntax-check all addon and test Lua files
        run: |
          find NaxxLootLottery tests -type f -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
      - name: Existing loot-identity regression
        run: lua5.1 tests/test_loot_identity.lua
      - name: Historical loot and Playerbot regression
        run: lua5.1 tests/test_loot_history_and_bots.lua
      - name: Raid-leader confirmed already-owned bot item (no false receipt)
        run: lua5.1 tests/test_manual_bot_obtained.lua
      - name: Need Before Greed pool safety regression
        run: lua5.1 tests/test_need_before_greed.lua
      - name: SavedVariables upgrade and reload preservation
        run: lua5.1 tests/test_need_greed_savedvariables.lua
      - name: Playerbot plan import/export and non-destructive apply
        run: lua5.1 tests/test_gear_plan_transfer.lua
      - name: Playerbot plan import/export dialog interaction
        run: lua5.1 tests/test_gear_plan_transfer_ui.lua
      - name: Mixed 40-bot Need Before Greed simulator regression
        run: lua5.1 tests/test_need_before_greed_sim.lua
      - name: Gear Plans six-row footer and status menus regression
        run: lua5.1 tests/test_gear_plans_layout.lua
      - name: Dark-only UI and SavedVariables regression
        run: lua5.1 tests/test_dark_skin.lua
      - name: Gear/items and recipe wishlist separation regression
        run: lua5.1 tests/test_recipe_wishlist.lua
      - name: Overview full-wishlist guidance regression
        run: lua5.1 tests/test_overview_wishlist_copy.lua
      - name: Raid loot search long-name and priority layout regression
        run: lua5.1 tests/test_search_layout.lua
      - name: Wishlist Inbox pagination and footer layout regression
        run: lua5.1 tests/test_inbox_layout.lua
      - name: Winner one-click consent and exact physical award safety
        run: |
          lua5.1 tests/test_award_winner_ui.lua
          lua5.1 tests/test_winner_popup_quick_award.lua
          lua5.1 tests/test_guild_transfer_settings_ui.lua
      - name: Leader-only guild material allocation and no-award checks
        run: lua5.1 tests/test_guild_material_leader_tickets.lua
