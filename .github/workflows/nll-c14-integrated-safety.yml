name: NLL C14 Integrated Safety (NO RELEASE)

on:
  push:
    branches:
      - dev/nll-c14-integration-hardening
  pull_request:
    branches:
      - dev/nll-duplicate-copy-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Lua 5.1 shared 604-plan / navigation / physical NO RETRY
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact stacked draft
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce parent, limited scope and immutable loot safeguards
        shell: bash
        run: |
          set -euo pipefail
          BASE=72286ede0d64a73f51fcc8ca7159a020031a4887
          git cat-file -e "$BASE^{commit}"
          git merge-base --is-ancestor "$BASE" HEAD
          while IFS= read -r file; do
            case "$file" in
              NaxxLootLottery/UI/MainFrame.lua|NaxxLootLottery/UI/WishlistFrame.lua|NaxxLootLottery/UI/GearPlanReviewFrame.lua|NaxxLootLottery/Core/Core.lua|NaxxLootLottery/NaxxLootLottery.toc|tests/test_c14_cross_feature_integration.lua|tests/test_master_checklist.py|tests/test_release_packaging.py|scripts/build_release_zip.py|README.md|docs/MASTER_DEVELOPMENT_CHECKLIST.md|docs/DEVELOPMENT_TRACKER.md|docs/INTEGRATED_RAID_TEST_CHECKLIST.md|docs/C14_INTEGRATION_RELEASE_READINESS.md|.github/workflows/nll-c14-integrated-safety.yml) ;;
              *) echo "::error::Unexpected C14 change outside safe integration scope: $file"; exit 1 ;;
            esac
          done < <(git diff --name-only "$BASE" HEAD)
          grep -Fxq '## Version: 0.1.0.29-rc.1-dev19' NaxxLootLottery/NaxxLootLottery.toc
          grep -Fq 'function UI:DismissContextReviews()' NaxxLootLottery/UI/MainFrame.lua
          grep -Fq 'frame:SetScript("OnHide"' NaxxLootLottery/UI/MainFrame.lua
          grep -Fq 'self:DismissContextReviews()' NaxxLootLottery/UI/MainFrame.lua
          grep -Fq 'function UI:CloseGearPlanTransfer()' NaxxLootLottery/UI/WishlistFrame.lua
          grep -Fq 'self.gearTransferCancelTransient=ClearPreview' NaxxLootLottery/UI/WishlistFrame.lua
          grep -Fq 'if self.gearPlanReviewDialog then self.gearPlanReviewDialog:Hide() end' NaxxLootLottery/UI/GearPlanReviewFrame.lua
          grep -Fq 'db.settings.directMasterLootEnabled = false' NaxxLootLottery/Storage/Database.lua
          grep -Fq 'db.settings.guildLootTransfersEnabled = false' NaxxLootLottery/Storage/Database.lua
          grep -Fq 'db.settings.guildAutoPreviewEnabled = false' NaxxLootLottery/Storage/Database.lua
          if git diff "$BASE" HEAD -- NaxxLootLottery/Storage/Database.lua NaxxLootLottery/Core/GearPlanReview.lua NaxxLootLottery/Core/GearPlanTransfer.lua NaxxLootLottery/Core/GearNeeds.lua NaxxLootLottery/Core/LootCopyAudit.lua NaxxLootLottery/Core/LootSourceDiagnostics.lua NaxxLootLottery/Core/LootIdentity.lua NaxxLootLottery/Core/LootDetection.lua NaxxLootLottery/Core/GuildLootTransfer.lua NaxxLootLottery/Core/GuildAutoPreview.lua NaxxLootLottery/Core/AwardWorkflow.lua NaxxLootLottery/Core/ReceiptSync.lua NaxxLootLottery/Core/LootReceiptTracker.lua | grep -q '^[+-][^+-]'; then
            echo "::error::An unrelated core, receipt, award, source or saved-data path changed"; exit 1
          fi
          if git diff "$BASE" HEAD -- NaxxLootLottery/UI/MainFrame.lua NaxxLootLottery/UI/WishlistFrame.lua NaxxLootLottery/UI/GearPlanReviewFrame.lua | grep -E '^\+[^+]' | grep -Eq '(GiveMasterLoot|RandomRoll|SendAddonMessage|GetLootSourceInfo)[[:space:]]*\('; then
            echo "::error::Navigation is not authorised to grant, roll or use modern API"; exit 1
          fi
      - name: Install Lua 5.1 (Wrath)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
      - name: Parse every Lua source and Lua test
        run: find NaxxLootLottery tests -type f -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
      - name: Run combined C14 604-plan integration first
        run: lua5.1 tests/test_c14_cross_feature_integration.lua
      - name: Run every existing and new Lua 5.1 regression
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/test_*.lua; do
            echo "Running $test_file"
            lua5.1 "$test_file"
          done
      - name: Historical/parallel draft checklist continuity
        run: python3 tests/test_master_checklist.py
      - name: Deterministic no-release candidate packaging
        run: python3 tests/test_release_packaging.py
      - name: Declare release gate still CLOSED
        run: |
          echo "Mocked CI is NOT real-client acceptance. No merge, install, release, SQL, SavedVariables, loot or addon deployment."
