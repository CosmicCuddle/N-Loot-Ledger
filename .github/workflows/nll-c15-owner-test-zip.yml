name: NLL C15 Owner TEST-ONLY ZIP (NO RELEASE)

on:
  push:
    branches:
      - dev/nll-live-ui-feedback
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner-test:
    name: Full Lua 5.1 checks + gated test-only addon artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Confirm version, consent safety and no publishing
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/dev/nll-live-ui-feedback"
          grep -Fxq '## Interface: 30300' NaxxLootLottery/NaxxLootLottery.toc
          grep -Fxq '## SavedVariables: NaxxLootLotteryDB' NaxxLootLottery/NaxxLootLottery.toc
          grep -Fxq '## Version: 0.1.0.29-rc.1-dev20' NaxxLootLottery/NaxxLootLottery.toc
          grep -Fq 'db.settings.directMasterLootEnabled = false' NaxxLootLottery/Storage/Database.lua
          grep -Fq 'db.settings.guildLootTransfersEnabled = false' NaxxLootLottery/Storage/Database.lua
          grep -Fq 'db.settings.guildAutoPreviewEnabled = false' NaxxLootLottery/Storage/Database.lua
          grep -Fq 'function Comm:RestoreArchivedSubmission(key)' NaxxLootLottery/Core/Communication.lua
          grep -Fq 'function H:ConfirmNewRun()' NaxxLootLottery/Core/RaidHistoryView.lua
          echo "Test-only. No migration, real account data, physical transfers or release."
      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
      - name: Parse ALL addons and tests
        run: find NaxxLootLottery tests -type f -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
      - name: Owner 636-plan safety and GUI screenshot regression
        run: lua5.1 tests/test_live_feedback_archive_history.lua
      - name: Complete historical and current Lua 5.1 suite
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/test_*.lua; do
            echo "Running $f"
            lua5.1 "$f"
          done
      - name: Master checklist retains earlier and parallel work
        run: python3 tests/test_master_checklist.py
      - name: Verify exact reproducible addon archive, never publish
        run: python3 tests/test_release_packaging.py
      - name: Produce test-only addon ZIP and signed-off checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_release_zip.py --output dist/Naxxramas-Loot-Ledger-v0.1.0.29-rc.1-dev20.zip
          (
            cd dist
            sha256sum Naxxramas-Loot-Ledger-v0.1.0.29-rc.1-dev20.zip > SHA256SUMS.txt
          )
          {
            echo 'OWNER TEST ONLY. DO NOT USE IN A LIVE RAID. NO RELEASE.'
            echo "Source commit: $GITHUB_SHA"
            echo 'Branch: dev/nll-live-ui-feedback'
            echo 'Version: 0.1.0.29-rc.1-dev20'
            echo 'WoW Interface: 30300 / Lua 5.1'
            echo '51 Lua modules and one .toc, 52 inner ZIP entries'
            echo 'Owner screenshot currently shows 636 plans; DO NOT restore older 604 count.'
            echo 'Back up full current dev19 addon and matching WTF account SavedVariables before manual install.'
            echo 'Archive / New Run View do not purge saved submissions, lottery history, award attempts or NO RETRY.'
            echo 'See docs/C15_OWNER_RETEST_HANDOFF.md for controlled tests.'
          } > dist/BUILD_INFO.txt
          echo 'INNER ZIP SHA256:'
          cat dist/SHA256SUMS.txt
      - name: Upload TEST-ONLY ZIP; never a release
        uses: actions/upload-artifact@v4
        with:
          name: NLL-TEST-ONLY-dev20-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/Naxxramas-Loot-Ledger-v0.1.0.29-rc.1-dev20.zip
            dist/SHA256SUMS.txt
            dist/BUILD_INFO.txt
            docs/C15_OWNER_RETEST_HANDOFF.md
