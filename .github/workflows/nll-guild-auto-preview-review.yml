name: NLL Guild Auto Preview safety (NO RELEASE)

on:
  push:
    branches:
      - dev/nll-guild-auto-preview
  pull_request:
    branches:
      - dev/nll-delivery-reconciliation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    name: Lua 5.1 / zero-physical-award guild dry run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact draft
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce preview-only scope and disabled transfer defaults
        shell: bash
        run: |
          set -euo pipefail
          BASE=138c0047ac727ee202e5ee990422ac288a5e6835
          git cat-file -e "$BASE^{commit}"
          git merge-base --is-ancestor "$BASE" HEAD
          while IFS= read -r file; do
            case "$file" in
              NaxxLootLottery/Core/GuildAutoPreview.lua|.github/workflows/nll-delivery-reconciliation-review.yml|NaxxLootLottery/UI/CurrentLootFrame.lua|NaxxLootLottery/Storage/Database.lua|NaxxLootLottery/NaxxLootLottery.toc|NaxxLootLottery/Core/Core.lua|scripts/build_release_zip.py|tests/test_release_packaging.py|tests/test_guild_auto_preview.lua|docs/TESTING_GUILD_AUTO_PREVIEW_DRAFT.md|.github/workflows/nll-guild-auto-preview-review.yml) ;;
              *) echo "::error::Unexpected file in read-only auto preview: $file"; exit 1;;
            esac
          done < <(git diff --name-only "$BASE" HEAD)
          grep -Fqx '## Version: 0.1.0.29-rc.1-dev5' NaxxLootLottery/NaxxLootLottery.toc
          grep -Fq 'db.settings.directMasterLootEnabled = false' NaxxLootLottery/Storage/Database.lua
          grep -Fq 'db.settings.guildLootTransfersEnabled = false' NaxxLootLottery/Storage/Database.lua
          grep -Fq 'db.settings.guildAutoPreviewEnabled = false' NaxxLootLottery/Storage/Database.lua
          if grep -Eq '^[[:space:]]*(GiveMasterLoot|RandomRoll)[[:space:]]*\(' NaxxLootLottery/Core/GuildAutoPreview.lua; then
            echo "::error::No direct item awards or rolls allowed in dry-run"; exit 1
          fi
      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
      - name: Parse all Lua 5.1 source/tests
        run: find NaxxLootLottery tests -type f -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
      - name: Execute every Lua regression
        shell: bash
        run: |
          set -euo pipefail
          for file in tests/test_*.lua; do
            echo "Running $file"
            lua5.1 "$file"
          done
      - name: Validate reproducible offline package
        run: python3 tests/test_release_packaging.py
      - name: Read-only review only
        run: echo "No installation, downloadable release artifact, GitHub release, merge or item transfer."
