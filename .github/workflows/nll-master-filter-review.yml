name: NLL Master Checklist and Exact Filter (NO RELEASE)

on:
  push:
    branches:
      - dev/nll-master-checklist-character-filter
  pull_request:
    branches:
      - dev/nll-duplicate-drop-safety
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Lua 5.1 / 604-row search / historical checklist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact stacked draft
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require exact base and limited non-awarding scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=96339df326c913ed7ac607112c154d6b9a3926a8
          git cat-file -e "$BASE^{commit}"
          git merge-base --is-ancestor "$BASE" HEAD
          while IFS= read -r file; do
            case "$file" in
              NaxxLootLottery/Core/GearNeeds.lua|NaxxLootLottery/UI/WishlistFrame.lua|NaxxLootLottery/Core/Core.lua|NaxxLootLottery/NaxxLootLottery.toc|tests/test_exact_character_filter.lua|tests/test_master_checklist.py|tests/test_release_packaging.py|scripts/build_release_zip.py|README.md|docs/MASTER_DEVELOPMENT_CHECKLIST.md|docs/DEVELOPMENT_TRACKER.md|docs/ROADMAP.md|docs/INTEGRATED_RAID_TEST_CHECKLIST.md|.github/workflows/nll-master-filter-review.yml) ;;
              *) echo "::error::Out-of-scope change: $file"; exit 1 ;;
            esac
          done < <(git diff --name-only "$BASE" HEAD)
          grep -Fxq '## Version: 0.1.0.29-rc.1-dev8' NaxxLootLottery/NaxxLootLottery.toc
          grep -Fq 'db.settings.directMasterLootEnabled = false' NaxxLootLottery/Storage/Database.lua
          grep -Fq 'db.settings.guildLootTransfersEnabled = false' NaxxLootLottery/Storage/Database.lua
          grep -Fq 'db.settings.guildAutoPreviewEnabled = false' NaxxLootLottery/Storage/Database.lua
          grep -Fq 'UI.gearPlanFilter=filterBox:GetText() or ""' NaxxLootLottery/UI/WishlistFrame.lua
          grep -Fq 'self:NormalizeCharacterName(need.character)==normalizedFilter' NaxxLootLottery/Core/GearNeeds.lua
      - name: Install WoW-compatible Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
      - name: Parse all Lua 5.1 addon and regression scripts
        run: find NaxxLootLottery tests -name '*.lua' -type f -print0 | xargs -0 -n1 luac5.1 -p
      - name: Full historical plus 604-row filter safety suite
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/test_*.lua; do
            echo "Running $test_file"
            lua5.1 "$test_file"
          done
      - name: Source-of-truth checklist regression
        run: python3 tests/test_master_checklist.py
      - name: Reproducible offline package validation
        run: python3 tests/test_release_packaging.py
      - name: Strict no-release policy
        run: echo "Draft only; no merge, physical loot award, live client or SavedVariables change."
