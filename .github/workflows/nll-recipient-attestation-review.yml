name: NLL Recipient Bag Attestation (NO RELEASE)

on:
  push:
    branches:
      - dev/nll-recipient-self-attestation
  pull_request:
    branches:
      - dev/nll-pending-receipt-holds
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Lua 5.1 / self-receipt audit / zero award
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact stacked head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail closed on unexpected scope or physical transfer
        shell: bash
        run: |
          set -euo pipefail
          BASE=a423fee247df62023609a14e911e3f60ec4bf58e
          git cat-file -e "$BASE^{commit}"
          git merge-base --is-ancestor "$BASE" HEAD
          while IFS= read -r file; do
            case "$file" in
              NaxxLootLottery/Core/GuildRecipientReceipt.lua|NaxxLootLottery/UI/GuildRecipientReceiptFrame.lua|NaxxLootLottery/UI/ReconciliationFrame.lua|NaxxLootLottery/Storage/Database.lua|NaxxLootLottery/Core/Core.lua|NaxxLootLottery/NaxxLootLottery.toc|scripts/build_release_zip.py|tests/test_release_packaging.py|tests/test_guild_recipient_self_attestation.lua|tests/test_master_checklist.py|docs/TESTING_GUILD_RECIPIENT_ATTESTATION_DRAFT.md|docs/MASTER_DEVELOPMENT_CHECKLIST.md|docs/DEVELOPMENT_TRACKER.md|docs/INTEGRATED_RAID_TEST_CHECKLIST.md|README.md|.github/workflows/nll-recipient-attestation-review.yml) ;;
              *) echo "::error::Unexpected change in recipient-only evidence draft: $file"; exit 1;;
            esac
          done < <(git diff --name-only "$BASE" HEAD)
          grep -Fxq '## Version: 0.1.0.29-rc.1-dev10' NaxxLootLottery/NaxxLootLottery.toc
          grep -Fq 'db.settings.directMasterLootEnabled = false' NaxxLootLottery/Storage/Database.lua
          grep -Fq 'db.settings.guildLootTransfersEnabled = false' NaxxLootLottery/Storage/Database.lua
          grep -Fq 'db.settings.guildAutoPreviewEnabled = false' NaxxLootLottery/Storage/Database.lua
          grep -Fq 'sourceVerified=false' NaxxLootLottery/Core/GuildRecipientReceipt.lua
          grep -Fq 'deliveryServerVerified=false' NaxxLootLottery/Core/GuildRecipientReceipt.lua
          grep -Fq 'grantsAuthorized=false' NaxxLootLottery/Core/GuildRecipientReceipt.lua
          if grep -Eq '(GiveMasterLoot|RandomRoll|SendAddonMessage)[[:space:]]*\(' NaxxLootLottery/Core/GuildRecipientReceipt.lua NaxxLootLottery/UI/GuildRecipientReceiptFrame.lua; then
            echo "::error::Recipient statement cannot award, roll or send network messages"; exit 1
          fi
      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
      - name: Lua 5.1 syntax across addon and tests
        run: find NaxxLootLottery tests -type f -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
      - name: All historical plus recipient-self regressions
        shell: bash
        run: |
          set -euo pipefail
          for file in tests/test_*.lua; do
            echo "Running $file"
            lua5.1 "$file"
          done
      - name: Master project checklist coverage
        run: python3 tests/test_master_checklist.py
      - name: Deterministic dev-only package validation
        run: python3 tests/test_release_packaging.py
      - name: No publishing or physical item transfer
        run: echo "Draft only; no WoW access, merge, release, item or SavedVariables changes."
