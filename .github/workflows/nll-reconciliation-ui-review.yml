name: NLL Reconciliation UI safety (NO RELEASE)

on:
  push:
    branches:
      - dev/nll-reconciliation-ui
  pull_request:
    branches:
      - dev/nll-guild-auto-preview
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    name: Lua 5.1 / protected investigation UI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact draft head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce navigation and no-award-only scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=14dd65ff24f015ce70a495b462bcedd1cb3e360a
          git cat-file -e "$BASE^{commit}"
          git merge-base --is-ancestor "$BASE" HEAD
          while IFS= read -r path; do
            case "$path" in
              NaxxLootLottery/UI/ReconciliationFrame.lua|NaxxLootLottery/UI/AwardHistoryFrame.lua|NaxxLootLottery/UI/CurrentLootFrame.lua|NaxxLootLottery/Core/Core.lua|NaxxLootLottery/NaxxLootLottery.toc|scripts/build_release_zip.py|tests/test_release_packaging.py|tests/test_reconciliation_ui.lua|docs/TESTING_RECONCILIATION_UI_DRAFT.md|.github/workflows/nll-reconciliation-ui-review.yml) ;;
              *) echo "::error::Unexpected change in non-awarding investigation UI: $path"; exit 1;;
            esac
          done < <(git diff --name-only "$BASE" HEAD)
          grep -Fqx '## Version: 0.1.0.29-rc.1-dev6' NaxxLootLottery/NaxxLootLottery.toc
          grep -Fq 'db.settings.directMasterLootEnabled = false' NaxxLootLottery/Storage/Database.lua
          grep -Fq 'db.settings.guildLootTransfersEnabled = false' NaxxLootLottery/Storage/Database.lua
          grep -Fq 'db.settings.guildAutoPreviewEnabled = false' NaxxLootLottery/Storage/Database.lua
          if grep -Eq '^[[:space:]]*(GiveMasterLoot|RandomRoll)[[:space:]]*\(' NaxxLootLottery/UI/ReconciliationFrame.lua; then
            echo "::error::Investigation UI is not allowed to send loot"; exit 1
          fi
      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
      - name: Syntax check all Lua 5.1 code
        run: find NaxxLootLottery tests -type f -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
      - name: Execute entire regression suite including GUI safety
        shell: bash
        run: |
          set -euo pipefail
          for file in tests/test_*.lua; do
            echo "Running $file"
            lua5.1 "$file"
          done
      - name: Validate reproducible development archive
        run: python3 tests/test_release_packaging.py
      - name: No publishing
        run: echo "This draft does not merge, award, publish, install or change SavedVariables."
